name: Release desktop and CLI packages

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            package: agents-council-linux-x64
            binary_ext: ""
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            package: agents-council-linux-arm64
            binary_ext: ""
          - runner: macos-15-intel
            platform: macos
            arch: x64
            package: agents-council-darwin-x64
            binary_ext: ""
          - runner: macos-14
            platform: macos
            arch: arm64
            package: agents-council-darwin-arm64
            binary_ext: ""
          - runner: windows-latest
            platform: win
            arch: x64
            package: agents-council-windows-x64
            binary_ext: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=isolated
      - name: Verify source version matches tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##refs/tags/v}"
          SOURCE_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          test "$SOURCE_VERSION" = "$TAG"
      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run format:check
          bun test
      - name: Build standalone CLI binary
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##refs/tags/v}"
          mkdir -p dist
          bun build src/cli/index.ts --compile --minify \
            --define __COUNCIL_VERSION__="\"${TAG}\"" \
            --outfile="dist/council${{ matrix.binary_ext }}"
      - name: Smoke-test CLI binary
        shell: bash
        run: |
          set -euo pipefail
          CLI_BIN="dist/council${{ matrix.binary_ext }}"
          if [[ "${{ matrix.platform }}" != "win" ]]; then
            chmod +x "$CLI_BIN"
          fi
          "./$CLI_BIN" --version
          "./$CLI_BIN" --help
      - name: Build stable desktop artifacts (Unix)
        if: ${{ matrix.platform != 'win' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##refs/tags/v}"
          AGENTS_COUNCIL_VERSION="$TAG" bunx electrobun build --env=stable
      - name: Build stable desktop artifacts (Windows)
        if: ${{ matrix.platform == 'win' }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $env:AGENTS_COUNCIL_VERSION = $tag
          bunx electrobun build --env=stable
      - name: Assemble release payload
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="stable-${{ matrix.platform }}-${{ matrix.arch }}-"
          mkdir -p bundle/cli bundle/desktop-artifacts
          cp "dist/council${{ matrix.binary_ext }}" "bundle/cli/council${{ matrix.binary_ext }}"
          if [[ ! -d artifacts ]] || ! compgen -G "artifacts/${PREFIX}*" > /dev/null; then
            echo "Missing Electrobun artifacts for ${PREFIX}" >&2
            exit 1
          fi
          find artifacts -maxdepth 1 -type f -name "${PREFIX}*" -exec cp {} bundle/desktop-artifacts/ \;
          test "$(find bundle/desktop-artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" -gt 0
          test "$(find bundle/desktop-artifacts -maxdepth 1 -type f -name "${PREFIX}*update.json" | wc -l | tr -d ' ')" -gt 0
          test "$(find bundle/desktop-artifacts -maxdepth 1 -type f -name "${PREFIX}*.tar.zst" | wc -l | tr -d ' ')" -gt 0
          case "${{ matrix.platform }}" in
            macos) test "$(find bundle/desktop-artifacts -type f -name "${PREFIX}*.dmg" | wc -l | tr -d ' ')" -gt 0 ;;
            linux) test "$(find bundle/desktop-artifacts -type f -name "${PREFIX}*Setup*.tar.gz" | wc -l | tr -d ' ')" -gt 0 ;;
            win) test "$(find bundle/desktop-artifacts -type f -name "${PREFIX}*Setup*.zip" | wc -l | tr -d ' ')" -gt 0 ;;
          esac
      - name: Generate Occult manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##refs/tags/v}"
          bun scripts/generateOccultReleaseManifest.ts \
            --root bundle \
            --version "$TAG" \
            --package "${{ matrix.package }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.package }}
          path: bundle
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish verified GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-agents-council-*
          path: release-assets
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          for bundle in release-assets/release-agents-council-*; do
            package="$(basename "$bundle" | sed 's/^release-//')"
            if [[ "$package" != *windows* ]]; then
              chmod +x "$bundle/cli/council"
            fi
            tar -C "$bundle" -czf "publish/${package}.tar.gz" .
            cp "$bundle/occult-release-manifest.json" "publish/${package}-occult-release-manifest.json"
            cp "$bundle/SHA256SUMS.txt" "publish/${package}-SHA256SUMS.txt"
          done
          cp CHANGELOG.md docs/occult-production-release.md publish/
          TAG="${GITHUB_REF_NAME#v}"
          awk -v version="$TAG" '
            $0 ~ "^## " version " " { capture=1 }
            capture && /^## / && $0 !~ "^## " version " " { exit }
            capture { print }
          ' CHANGELOG.md > publish/RELEASE-NOTES.md
          test -s publish/RELEASE-NOTES.md
          (
            cd publish
            find . -maxdepth 1 -type f ! -name RELEASE-SHA256SUMS.txt -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > RELEASE-SHA256SUMS.txt
          )
      - name: Sign and verify complete release checksum manifest
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: publish/RELEASE-SHA256SUMS.txt
          verify: true
          verify-cert-identity: >-
            https://github.com/SgtSlummy/agents-council/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" publish/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Agents Council ${GITHUB_REF_NAME}" \
            --notes-file publish/RELEASE-NOTES.md \
            --latest=false \
            --verify-tag
