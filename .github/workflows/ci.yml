name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve LF line endings on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.os }}-bun-1.3.9-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-bun-1.3.9-
      - run: bun install --frozen-lockfile --linker=isolated
      - run: bun test
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check

  electrobun-build-smoke:
    name: electrobun-build-smoke-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.os }}-bun-1.3.9-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-bun-1.3.9-
      - run: bun install --frozen-lockfile --linker=isolated
      - name: Build host CLI binary
        shell: bash
        run: |
          mkdir -p dist
          OUT="dist/council-test"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            OUT="${OUT}.exe"
          fi
          bun build src/cli/index.ts --compile --minify --outfile="$OUT"
          echo "CLI_OUT=$OUT" >> "$GITHUB_ENV"
      - name: Smoke-test CLI binary
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" != "win" ]]; then
            chmod +x "$CLI_OUT"
          fi
          "./$CLI_OUT" --version
          "./$CLI_OUT" --help
      - name: Build Electrobun stable artifacts (Unix)
        if: ${{ matrix.platform != 'win' }}
        shell: bash
        env:
          AGENTS_COUNCIL_VERSION: "ci-smoke"
        run: |
          bun run desktop:build:stable
      - name: Build Electrobun stable artifacts (Windows)
        if: ${{ matrix.platform == 'win' }}
        shell: pwsh
        run: |
          $env:AGENTS_COUNCIL_VERSION = "ci-smoke"
          bun run desktop:build:stable
      - name: Validate Electrobun artifact set
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts
          PREFIX="stable-${{ matrix.platform }}-"
          ALL_COUNT=$(find artifacts -maxdepth 1 -type f -name "${PREFIX}*" | wc -l | tr -d ' ')
          if [[ "$ALL_COUNT" -eq 0 ]]; then
            echo "No Electrobun artifacts found for prefix: ${PREFIX}"
            exit 1
          fi
          UPDATE_COUNT=$(find artifacts -maxdepth 1 -type f -name "${PREFIX}*update.json" | wc -l | tr -d ' ')
          if [[ "$UPDATE_COUNT" -eq 0 ]]; then
            echo "Missing update metadata for ${PREFIX}"
            exit 1
          fi
          BUNDLE_COUNT=$(find artifacts -maxdepth 1 -type f -name "${PREFIX}*.tar.zst" | wc -l | tr -d ' ')
          if [[ "$BUNDLE_COUNT" -eq 0 ]]; then
            echo "Missing compressed desktop bundle for ${PREFIX}"
            exit 1
          fi
          case "${{ matrix.platform }}" in
            macos)
              INSTALLER_COUNT=$(find artifacts -maxdepth 1 -type f -name "${PREFIX}*.dmg" | wc -l | tr -d ' ')
              ;;
            linux)
              INSTALLER_COUNT=$(find artifacts -maxdepth 1 -type f -name "${PREFIX}*Setup*.tar.gz" | wc -l | tr -d ' ')
              ;;
            win)
              INSTALLER_COUNT=$(find artifacts -maxdepth 1 -type f -name "${PREFIX}*Setup*.zip" | wc -l | tr -d ' ')
              ;;
            *)
              echo "Unsupported platform: ${{ matrix.platform }}"
              exit 1
              ;;
          esac
          if [[ "$INSTALLER_COUNT" -eq 0 ]]; then
            echo "Missing desktop installer artifact for ${PREFIX}"
            exit 1
          fi
      - name: Validate Occult release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-smoke/cli release-smoke/desktop-artifacts
          cp "$CLI_OUT" release-smoke/cli/
          cp artifacts/stable-${{ matrix.platform }}-* release-smoke/desktop-artifacts/
          bun scripts/generateOccultReleaseManifest.ts \
            --root release-smoke \
            --version ci-smoke \
            --package agents-council-${{ matrix.platform }}-smoke
          test -s release-smoke/occult-release-manifest.json
          test -s release-smoke/SHA256SUMS.txt
